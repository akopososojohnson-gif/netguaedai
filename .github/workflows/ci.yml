name: NetGuard AI CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black
    
    - name: Run flake8
      run: |
        flake8 netguaedai/netguard/netguard/services/ netguaedai/netguard/netguard/web/ --count --select=E9,F63,F7,F82 --show-source --statistics || true
    
    - name: Check Python syntax
      run: |
        python -m py_compile netguaedai/netguard/netguard/services/capture.py
        python -m py_compile netguaedai/netguard/netguard/services/processor.py
        python -m py_compile ai_training/train_models.py

  test-services:
    name: Test Core Services
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: netguard
          POSTGRES_USER: netguard
          POSTGRES_DB: netguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libpcap-dev
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Test imports
      run: |
        python -c "from scapy.all import sniff, IP, TCP, UDP"
        python -c "import redis"
        python -c "import psycopg2"
        python -c "import django"
        python -c "import xgboost"
        python -c "import sklearn"
    
    - name: Test Redis connection
      run: |
        python -c "import redis; r = redis.Redis(host='localhost', port=6379); print(r.ping())"
    
    - name: Test PostgreSQL connection
      env:
        PGPASSWORD: netguard
      run: |
        psql -h localhost -U netguard -d netguard -c "SELECT 1;"

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      run: |
        docker build -t netguard-ai:test .
    
    - name: Test Docker image
      run: |
        docker run --rm netguard-ai:test python --version
